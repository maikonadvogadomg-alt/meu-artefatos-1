kind = "web"
  previewPath = "/playground/"
  title = "SK Playground"
  version = "1.0.0"
  id = "artifacts/apk-builder"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/playground/" ]
  localPort = 21448

  [services.development]
  run = "pnpm --filter @workspace/playground run dev"

  [services.production]
  build = [ "pnpm", "--filter", "@workspace/playground", "run", "build" ]
  publicDir = "artifacts/playground/dist/public"
  serve = "static"

  [[services.production.rewrites]]
  from = "/*"
  to = "/index.html"

  [services.env]
  PORT = "21448"
  BASE_PATH = "/playground/"
  